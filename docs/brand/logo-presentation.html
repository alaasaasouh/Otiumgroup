<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otium Nexus Group — Original Earthy Gradients</title>
<style>
@font-face{font-family:DM;src:url('../../assets/fonts/dm-sans-normal-latin.woff2') format('woff2');font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#171b1b;color:#d9d3c7;font:14px DM,Arial,sans-serif}.board{width:1600px;min-height:1200px;margin:auto}.masthead{height:130px;padding:54px 80px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9d3c726}.label{font-size:12px;letter-spacing:.17em;text-transform:uppercase}.muted{color:#92988f}.main{height:570px;display:flex;align-items:center;justify-content:center;padding:90px 180px}.main img{display:block;width:100%;height:100%;object-fit:contain}.proofs{display:grid;grid-template-columns:1fr 1fr;margin:0 80px;border:1px solid #d9d3c726}.proof{height:300px;padding:32px;display:flex;flex-direction:column;justify-content:space-between}.light{background:#d9d3c7;color:#2b302d}.inverse{height:155px;width:350px;margin:auto;background:#2b302d;mask:url('../../assets/images/otium-nexus-logo.png') center/contain no-repeat}.header-proof{margin:auto 0;padding:22px 0;display:flex;align-items:center;justify-content:space-between;border-block:1px solid #d9d3c733;gap:30px}.header-proof img{width:180px;height:auto}.nav{display:flex;gap:18px;font-size:11px;color:#c7ccc3}.footer{padding:47px 80px;display:flex;justify-content:space-between;align-items:center}.details{color:#a7afa5;font-size:13px;line-height:1.8}.swatches{display:flex;gap:24px;font-size:12px;color:#a7afa5}.swatches span{display:flex;gap:10px;align-items:center}.swatches i{width:18px;height:18px;display:block;border:1px solid #d9d3c750}.beige{background:#d9d3c7}.charcoal{background:#171b1b}
@media(max-width:900px){.board{width:100%;min-height:100vh}.masthead{height:auto;padding:28px;gap:20px}.main{height:330px;padding:45px 30px}.proofs{grid-template-columns:1fr;margin:0 24px}.proof{height:260px;padding:24px}.footer{padding:30px 24px;gap:25px;flex-wrap:wrap}.inverse{max-width:100%}.nav{gap:10px;font-size:10px}.label{font-size:10px}}
</style>
</head>
<body><main class="board">
<header class="masthead"><span class="label">Otium Nexus Group / Identity refinement</span><span class="label muted">02 / Original earthy gradients</span></header>
<section class="main" aria-label="Primary logo"><img src="../../assets/images/otium-nexus-logo.png?v=earthy-20261117" alt="Original Otium design with sculptural I, full-width Nexus Group and earthy beige gradients"></section>
<section class="proofs" aria-label="Logo applications">
<div class="proof" style="background:#303b32"><span class="label">Earthy background</span><img src="../../assets/images/otium-nexus-logo.png?v=earthy-20261117" alt="Earthy gradient logo on a muted olive background" style="width:350px;max-width:100%;height:155px;object-fit:contain;margin:auto"></div>
<div class="proof"><span class="label muted">Website scale / 180 px</span><div class="header-proof"><img src="../../assets/images/otium-nexus-logo.png?v=earthy-20261117" alt="Logo shown at navbar size"><div class="nav"><span>Home</span><span>Productions</span><span>Events</span><span>Contact</span></div></div></div>
</section>
<footer class="footer"><div class="details">Original lettering. Sculptural I. Muted earthy gradients.<br>Approved identity / 17 November 2026</div><div class="swatches"><span><i class="beige"></i>Stone / #D9D3C7</span><span><i class="charcoal"></i>Charcoal / #171B1B</span></div></footer>
</main></body></html>
